# WebSocket + real-time services

server:
  host: "0.0.0.0"
  port: 8080

routes:
  - name: "chat-websocket"
    listen_path: "/ws"
    upstream_urls:
      - "http://chat-service:8080"
    websocket: true
    timeout: 0s

  - name: "realtime-events"
    listen_path: "/events"
    upstream_urls:
      - "http://events-service:8081"
    websocket: true

  - name: "rest-api"
    listen_path: "/api"
    upstream_urls:
      - "http://api-service:3000"
    compression: true
    rate_limit:
      rate: 200
      burst: 400
      per_ip: true

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  port: 9090

health:
  enabled: true
  path: "/health"
