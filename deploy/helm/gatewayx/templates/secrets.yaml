apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatewayx.fullname" . }}-secrets
  labels:
    {{- include "gatewayx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.apiKeys }}
  api-key-{{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
