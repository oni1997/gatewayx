apiVersion: v1
kind: ConfigMap
metadata:
  name: gatewayx-config
  namespace: gatewayx
data:
  gatewayx.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
    routes: []
    logging:
      level: "info"
      format: "json"
      output: "stdout"
    metrics:
      enabled: true
      port: 9090
      path: "/metrics"
      tracing: false
      history: 1000
    health:
      enabled: true
      path: "/health"
    security:
      max_body_size: 10485760
    tls:
      enabled: false
    plugins:
      dir: "/etc/gatewayx/plugins"
      enabled: []
