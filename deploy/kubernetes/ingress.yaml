apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatewayx
  namespace: gatewayx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  labels:
    app: gatewayx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gateway.example.com
      secretName: gatewayx-tls
  rules:
    - host: gateway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatewayx
                port:
                  number: 8080
