apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayx
  namespace: gatewayx
  labels:
    app: gatewayx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gatewayx
  template:
    metadata:
      labels:
        app: gatewayx
    spec:
      serviceAccountName: gatewayx
      containers:
        - name: gatewayx
          image: ghcr.io/oni1997/gatewayx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gatewayx
              readOnly: true
          env:
            - name: GATEWAYX_CONFIG
              value: /etc/gatewayx/gatewayx.yaml
      volumes:
        - name: config
          configMap:
            name: gatewayx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayx
  namespace: gatewayx
  labels:
    app: gatewayx
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: gatewayx
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayx-external
  namespace: gatewayx
  labels:
    app: gatewayx
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      name: http
      protocol: TCP
    - port: 443
      targetPort: 8443
      name: https
      protocol: TCP
  selector:
    app: gatewayx
---
apiVersion: v1
kind: Namespace
metadata:
  name: gatewayx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatewayx
  namespace: gatewayx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatewayx
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatewayx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatewayx
subjects:
  - kind: ServiceAccount
    name: gatewayx
    namespace: gatewayx
