server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

routes:
  - name: "example-api"
    listen_path: "/api"
    upstream_urls:
      - "http://localhost:3000"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false
    headers:
      X-Gateway: "GatewayX"
    timeout: 30s
    load_balancing: "round_robin"

  - name: "example-web"
    listen_path: "/"
    upstream_urls:
      - "http://localhost:8000"
    methods:
      - GET
    strip_path: false
    timeout: 30s

logging:
  level: "info"
  format: "json"
  output: "stdout"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
  tracing: false
  history: 1000

health:
  enabled: true
  path: "/health"

plugins:
  dir: "./plugins"

security:
  max_body_size: 10485760

tls:
  enabled: false
